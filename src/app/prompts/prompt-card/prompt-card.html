<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="mb-0">{{prompt().title}}</h3>
      <div
        class="text-sm text-color-secondary font-bold">&#64;{{prompt().author.username}}</div>
    </div>
    <div class="flex gap-2">
      @if (canEdit()) {
        <p-button [routerLink]="['/prompts', prompt().id, 'edit']" icon="pi pi-pencil" size="small" [text]="true" />
      }
      <p-button icon="pi pi-copy" size="small" (onClick)="copyToClipboard()"
        [text]="true" />
    </div>
  </div>
  <textarea class="w-full mb-2" pTextarea readonly style="width: 100%"
    rows="8"> {{prompt().content}} </textarea>
  <div class="flex justify-content-between align-items-center">
    <p-tag [value]="prompt().category.name" severity="secondary" />
    <div class="flex gap-2 align-items-center">
      <p-button [loading]="voting()" (onClick)="upvote()" icon="pi pi-thumbs-up" size="small" [severity]="userVote() === 'up' ? 'primary' : 'secondary'" />
      <span> {{score()}} </span>
      <p-button [loading]="voting()" (onClick)="downvote()" icon="pi pi-thumbs-down" size="small" [severity]="userVote() === 'down' ? 'primary' : 'secondary'" />
    </div>
  </div>
</p-card>
